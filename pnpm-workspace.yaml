packages:
  - 'packages/*'
  - 'stubs/*'

# @deepseek-ai/dsh-compact, dsh-type-meta and dsh-user-interaction are not
# published to npm but dsh-client-runtime (and its transitive deps) depend on
# them for internal types, which skipLibCheck skips. Resolve them to local
# type-only stubs so the install succeeds.
overrides:
  '@deepseek-ai/dsh-agent': 0.1.0-rc.6
  '@smithy/node-http-handler': 4.10.0
  '@aws-sdk/token-providers': 3.1110.0
  '@deepseek-ai/dsh-base': 0.1.1-rc.1
  '@deepseek-ai/dsh-llm-pi-ai': 0.1.1-rc.1
  '@deepseek-ai/dsh-compact': workspace:*
  '@deepseek-ai/dsh-type-meta': workspace:*
  '@deepseek-ai/dsh-user-interaction': workspace:*
  '@deepseek-ai/dsh-paths': workspace:*
  '@deepseek-ai/dsh-tasks': workspace:*
  '@deepseek-ai/dsh-client-ui-slash': workspace:*

onlyBuiltDependencies:
  - esbuild
  # Required native/runtime installers for the standalone DSH sidecar.
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - koffi
  - node-pty
  - protobufjs

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
