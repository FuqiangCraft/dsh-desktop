name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish signed Tauri release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $desktop = Get-Content packages/dsh-desktop-rust/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($desktop.version)" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Tauri desktop version $($desktop.version)"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Run release checks
        run: pnpm check

      - name: Build, sign and publish Tauri update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeepSeek Harness 桌面版 v__VERSION__'
          releaseBody: '请从 Assets 下载 Windows 安装包。已安装版本可通过应用内更新自动升级。'
          releaseDraft: false
          prerelease: false
          args: --config packages/dsh-desktop-rust/tauri.conf.json --features tauri-shell
