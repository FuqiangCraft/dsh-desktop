name: Feature Request
description: Propose a new feature or enhancement for DeepSeek Harness Desktop
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We appreciate suggestions for improving DeepSeek Harness Desktop!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or use case is.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
