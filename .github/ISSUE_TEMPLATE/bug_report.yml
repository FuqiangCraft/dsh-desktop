name: Bug Report
description: Report a reproducible bug in DeepSeek Harness Desktop plugin or native shell
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start DSH with desktop plugin loaded
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node.js version, DSH version
      placeholder: Windows 11, Node v24.16.0, DSH v0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Console output or error stack trace
      render: shell
