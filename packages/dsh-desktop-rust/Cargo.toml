[package]
name = "dsh-desktop-host"
version = "1.0.5"
default-run = "dsh-desktop-tauri"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust process supervisor for DeepSeek Harness Desktop"
build = "build.rs"

[features]
default = []
tauri-shell = ["dep:sys-locale", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sys-locale = { version = "0.3.2", optional = true }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
dirs = "6"
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
base64 = "0.22"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[[bin]]
name = "dsh-desktop-tauri"
path = "src/tauri_main.rs"
required-features = ["tauri-shell"]
