appId: com.deepseek.harness.desktop
productName: DSH Desktop
asar: true
artifactName: DSH-Desktop-${version}-${arch}.${ext}
directories:
  output: ../../dist-electron
  buildResources: assets/icons
files:
  - dist/**
  - assets/**
  - package.json
  # DSH discovers many plugins at runtime, so include the complete resolved
  # production dependency tree instead of relying on static import analysis.
  - node_modules/**
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/node_modules/**/{test,tests,example,examples}/**'
  - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
  - '!**/node_modules/node-pty/prebuilds/linux-*/**'
  - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!**/node_modules/node-pty/third_party/**/win10-arm64/**'
  - '!**/node_modules/koffi/lib/native/*-arm64/**'
  - '!**/node_modules/@img/*arm64*/**'
extraResources:
  - from: node_modules/@deepseek-ai/dsh/config/agent-presets
    to: agent-presets
    filter:
      - '**/*'
electronLanguages:
  - en-US
  - zh-CN
nsis:
  artifactName: DSH-Desktop-${version}-${arch}-Setup.${ext}
  runAfterFinish: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: DSH-Desktop-${version}-${arch}-Portable.${ext}
publish:
  provider: github
  owner: FuqiangCraft
  repo: dsh-desktop
