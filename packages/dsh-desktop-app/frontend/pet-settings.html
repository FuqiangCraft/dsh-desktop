<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宠物设置</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;font-family:"Segoe UI",system-ui,sans-serif;background:#f7f8fa;color:#172033}h1{margin:0 0 6px;font-size:22px}.sub{margin:0 0 24px;color:#667085;font-size:13px}.card{padding:20px;border:1px solid #e4e7ec;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}label{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #eef0f3;font-size:14px}label:last-child{border:0}.copy{display:flex;flex-direction:column;gap:3px}.hint{font-size:12px;color:#8a94a6}select,input[type=range]{width:170px}select{padding:8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.toggle{width:18px;height:18px}.value{min-width:42px;text-align:right;color:#475467;font-size:13px}.range{display:flex;align-items:center;gap:8px}.notice{margin-top:18px;padding:12px 14px;border-radius:10px;background:#eef4ff;color:#315ea8;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
  <h1>桌面宠物</h1>
  <p class="sub">这些设置属于桌面应用，无需安装 Web 插件。</p>
  <div class="card">
    <label><span class="copy"><strong>显示宠物</strong><span class="hint">默认开启，可随时从托盘隐藏</span></span><input id="enabled" class="toggle" type="checkbox"></label>
    <label><span class="copy"><strong>默认角色</strong><span class="hint">选择桌面伴侣形象</span></span><select id="character"><option value="robot">机器人</option><option value="whale">鲸鱼</option><option value="cat">小猫</option></select></label>
    <label><span class="copy"><strong>宠物大小</strong><span class="hint">60%–140%</span></span><span class="range"><input id="size" type="range" min="60" max="140" step="5"><span id="sizeValue" class="value"></span></span></label>
  </div>
  <div class="notice">安装 @mixian/dsh-desktop-plugin 后，DSH Web 设置页也会显示同一组宠物选项。</div>
  <script>
    const invoke=(command,args={})=>window.__TAURI_INTERNALS__.invoke(command,args);
    const enabled=document.getElementById('enabled'),character=document.getElementById('character'),size=document.getElementById('size'),sizeValue=document.getElementById('sizeValue');
    let settings={petEnabled:true,petCharacter:'robot',petSize:100};
    const render=()=>{enabled.checked=settings.petEnabled;character.value=['robot','whale','cat'].includes(settings.petCharacter)?settings.petCharacter:'robot';size.value=String(settings.petSize);sizeValue.textContent=`${settings.petSize}%`};
    const save=()=>{settings={petEnabled:enabled.checked,petCharacter:character.value,petSize:Number(size.value)};render();invoke('sync_desktop_settings',{settings}).catch(console.error)};
    enabled.addEventListener('change',save);character.addEventListener('change',save);size.addEventListener('input',save);
    invoke('get_desktop_settings').then(value=>{if(value)settings=value;render()}).catch(()=>render());
  </script>
</body>
</html>
