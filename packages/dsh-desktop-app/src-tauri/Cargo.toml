[package]
name = "dsh-desktop-app"
version = "0.2.0"
description = "DeepSeek Harness Desktop — native shell embedding the dsh web UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
