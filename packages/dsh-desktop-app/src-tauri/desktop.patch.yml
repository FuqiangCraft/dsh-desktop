# The DSH native picker is spawned by the background Node host and has no
# reliable owner window inside the Tauri shell. Pin the official in-app browse
# interaction so Add Workspace always renders inside the desktop WebView.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
